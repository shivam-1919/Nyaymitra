services:
  - type: web
    name: nyaymitra
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
